# VANKO VPN — WireGuard configuration template
# This is a TEMPLATE, not a working VPN configuration.
# Replace every value inside <...> with data from your real VPN server.

[Interface]
PrivateKey = <CLIENT_PRIVATE_KEY>
Address = <CLIENT_IP/CIDR>
DNS = <DNS_SERVER>

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = <SERVER_IP:PORT>
PersistentKeepalive = 25
