# VANKO VPN — безопасный шаблон WireGuard
# Замените значения в <...> на параметры вашего реального VPN-сервера.
# Этот файл НЕ является рабочей конфигурацией.

[Interface]
PrivateKey = <CLIENT_PRIVATE_KEY>
Address = <CLIENT_IP/CIDR>
DNS = <DNS_SERVER>

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = <SERVER_IP:PORT>
PersistentKeepalive = 25
